name: Release Concordium Contracts Common Derive

on:
  workflow_dispatch: # allows manual trigger

  push:
    tags:
      - releases/concordium-contracts-common-derive/*

env:
  TAG: ${{ github.ref_name }}

jobs:

  ## Concordium Contracts Common Derive Release Build
  contracts-common-derive-release:
    name: contracts-common-derive:release
    runs-on: ubuntu-latest
    defaults:
      run:
        # Set the default working directory to concordium-contracts-common-derive
        working-directory: smart-contracts/contracts-common/concordium-contracts-common-derive

    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Validate that the tag version matches the version in Cargo.toml
      - name: validate tag version has correct matching tag
        run: |
          echo "Validating tag version $TAG matches expected version from Cargo.toml"
          EXPECTED_VERSION_FROM_CARGO=$(yq .package.version ./Cargo.toml)
          TAG_VERSION_NUMBER=${TAG##releases/concordium-contracts-common-derive/}

          # Check if the tag version number matches the expected version from Cargo.toml
          if [ "$TAG_VERSION_NUMBER_NUMBER" != "$EXPECTED_VERSION_FROM_CARGO" ]; then
            echo "version tagged: $TAG_VERSION_NUMBER_NUMBER  does not match cargo version: $EXPECTED_VERSION_FROM_CARGO. Exiting."
            exit 1
          else
            echo "Tag version number matches expected version from Cargo.toml. Proceeding with release."
          fi

      # Publish to crates.io
      - name: Publish to crates.io
        env:
          CARGO_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          echo "Publishing Concordium Contracts Common Derive to crates.io for version: $TAG_VERSION_NUMBER"
          cargo publish --token $CARGO_TOKEN --locked
