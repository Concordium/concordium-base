<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta charset="utf-8">
  <style>
    input[type=text]:not([id=username]), input[type=number], input[type=month], select {
      width: 100%;
      padding: 12px 20px;
      margin: 8px 0;
      display: inline-block;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    input[type=submit] {
      width: 100%;
      background-color: #4CAF50;
      color: white;
      padding: 14px 20px;
      margin: 8px 0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }

    input[type=submit]:hover {
      background-color: #45a049;
    }

    div {
      border-radius: 5px;
      background-color: #f2f2f2;
      padding: 20px;
    }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const date = new Date();
      const month = `${date.getMonth() + 1}`.padStart(2, '0');
      const year = date.getFullYear() + 1;
      document.getElementById('expiry').value = `${year}-${month}`;
    });
  </script>
</head>
<body>
  <div>
    <h1>Concordium Identity Verification</h1>
    <form action="/api/submit" method="post" accept-charset="utf-8">
      <input type="hidden" id="idcredpub" name="id_cred_pub" value="$id_cred_pub$">
      <input type="hidden" id="endpointversion" name="endpoint_version" value="$endpoint_version$">
      <input type="hidden" id="idcredpubsignature" name="id_cred_pub_signature" value="$id_cred_pub_signature$">

      $login_fields$

      <label for="fail">Fail identity</label>
      <input type="checkbox" id="fail" name="fail" value="True">
      <br/>
      <label for="fail_delay">Seconds to delay before failing identity</label>
      <input type="number" id="fail_delay" name="fail_delay" value="10">

      <label for="expiry">Identity expiry</label>
      <input type="month" id="expiry" name="expiry" required="required">

      $attribute_fields$

      <input type="submit" value="Submit">
    </form>
  </div>
</body>
</html>
