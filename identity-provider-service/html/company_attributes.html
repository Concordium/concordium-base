<div class="field wide">
  <label for="legalName">Legal name</label
  ><input
    type="text"
    id="legalName"
    name="legalName"
    required
    aria-describedby="legalName-hint legalName-error"
  /><span class="helper" id="legalName-hint"
    >The company’s registered name.</span
  >
  <p class="error" id="legalName-error" hidden></p>
</div>
<div class="field wide">
  <label for="legalCountry">Legal jurisdiction country</label
  ><select
    id="legalCountry"
    name="legalCountry"
    required
    data-country
    aria-describedby="legalCountry-hint legalCountry-error"
  >
    <option value="">Select a country</option>
    $country_options$</select
  ><span class="helper" id="legalCountry-hint"
    >The country where the company is registered.</span
  >
  <p class="error" id="legalCountry-error" hidden></p>
</div>
<div class="field">
  <label for="businessNumber">Business number</label
  ><input
    type="text"
    id="businessNumber"
    name="businessNumber"
    aria-describedby="businessNumber-hint businessNumber-error"
  /><span class="helper" id="businessNumber-hint"
    >The company’s business registration number. Enter this number, an LEI, or
    both.</span
  >
  <p class="error" id="businessNumber-error" hidden></p>
</div>
<div class="field">
  <label for="lei">Legal Entity Identifier (LEI)</label
  ><input
    type="text"
    id="lei"
    name="lei"
    aria-describedby="lei-hint lei-error"
  /><span class="helper" id="lei-hint"
    >The company’s identifier for financial transactions. Optional if you enter
    a business number.</span
  >
  <p class="error" id="lei-error" hidden></p>
</div>
<div class="field wide">
  <label for="registrationAuth">Registration authority (optional)</label
  ><input
    type="text"
    id="registrationAuth"
    name="registrationAuth"
    aria-describedby="registrationAuth-hint"
  /><span class="helper" id="registrationAuth-hint"
    >The authority that registered the company.</span
  >
</div>
